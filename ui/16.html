<!DOCTYPE html><html lang="zh-CN" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#1A1C1E",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#D1E4FF",
                        "on-primary-container": "#001D36",
                        secondary: "#535F70",
                        "on-secondary": "#FFFFFF",
                        surface: "#FDFBFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DFE2EB",
                        "on-surface-variant": "#43474E",
                        outline: "#73777F",
                        "outline-variant": "#C3C7CF",
                        "inverse-surface": "#2F3033",
                        "primary-fixed": "#D1E4FF",
                        "secondary-fixed-dim": "#BBC7DB"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "enterprise": "12px"
                    },
                    spacing: {
                        "margin-page": "1.5rem",
                        "gutter-grid": "1rem"
                    },
                    fontFamily: {
                        "headline": ["Public Sans", "sans-serif"],
                        "display": ["Public Sans", "sans-serif"],
                        "body": ["Public Sans", "sans-serif"],
                        "label": ["Public Sans", "sans-serif"]
                    },
                    fontSize: {
                        "h1": ["1.5rem", { lineHeight: "2rem", fontWeight: "700" }],
                        "h2": ["1.25rem", { lineHeight: "1.75rem", fontWeight: "600" }],
                        "label-sm": ["0.75rem", { lineHeight: "1rem", fontWeight: "500" }]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Public Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-header {
            background: rgba(253, 251, 255, 0.8);
            backdrop-filter: blur(12px);
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(26, 28, 30, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-margin-page h-14 w-full bg-surface-container-lowest dark:bg-inverse-surface border-b border-outline-variant dark:border-outline glass-header">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform hover:opacity-80 p-2 -ml-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-h2 text-h2 text-primary dark:text-primary-fixed">服务体系</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="more_vert">more_vert</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-20 pb-10 px-margin-page max-w-2xl mx-auto w-full">
<!-- Title Section -->
<div class="mb-8">
<h2 class="text-2xl font-bold tracking-tight text-primary mb-2">企业注册资料填写</h2>
<p class="text-on-surface-variant text-sm">请核对您的企业证照信息，准确填写以下各项内容以完成入驻申请。</p>
</div>
<!-- Form Section -->
<form class="space-y-6" id="registrationForm">
<!-- Form Card -->
<div class="bg-white p-6 rounded-enterprise border border-outline-variant/30 shadow-sm">
<!-- Field: Unified Social Credit Code -->
<div class="space-y-2 mb-6">
<label class="block text-sm font-semibold text-on-surface-variant px-1" for="social-code">
                        统一社会信用代码</label>
<div class="relative transition-transform">
<input class="w-full h-14 bg-[#F2F3F5] border-none rounded-enterprise px-4 text-primary placeholder:text-outline focus:ring-2 focus:ring-primary/10 transition-all" id="social-code" name="social-code" placeholder="请输入18位统一社会信用代码" type="text">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline" data-icon="verified_user">verified_user</span>
</div>
</div>
<!-- Field: Enterprise Name -->
<div class="space-y-2 mb-6">
<label class="block text-sm font-semibold text-on-surface-variant px-1" for="enterprise-name">
                        企业名称</label>
<div class="relative transition-transform">
<input class="w-full h-14 bg-[#F2F3F5] border-none rounded-enterprise px-4 text-primary placeholder:text-outline focus:ring-2 focus:ring-primary/10 transition-all" id="enterprise-name" name="enterprise-name" placeholder="须与营业执照名称完全一致" type="text">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline" data-icon="business">business</span>
</div>
</div>
<!-- Field: Contact Information -->
<div class="space-y-2"><label class="block text-sm font-semibold text-on-surface-variant px-1" for="contact-info">联系人联系方式</label><div class="flex gap-2"><div class="relative flex-grow transition-transform"><input class="w-full h-14 bg-[#F2F3F5] border-none rounded-enterprise px-4 text-primary placeholder:text-outline focus:ring-2 focus:ring-primary/10 transition-all" id="contact-info" name="contact-info" placeholder="请输入手机号或联系电话" type="tel"><span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline" data-icon="call">call</span></div><button type="button" class="px-4 h-14 bg-[#F2F3F5] text-primary font-medium rounded-enterprise active:scale-95 transition-all hover:bg-surface-variant/50 whitespace-nowrap">发送验证码</button></div><div class="mt-4 space-y-2"><label class="block text-sm font-semibold text-on-surface-variant px-1" for="verify-code">验证码</label><div class="relative transition-transform"><input class="w-full h-14 bg-[#F2F3F5] border-none rounded-enterprise px-4 text-primary placeholder:text-outline focus:ring-2 focus:ring-primary/10 transition-all" id="verify-code" name="verify-code" placeholder="请输入6位验证码" type="text"><span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline" data-icon="lock_open">lock_open</span></div></div></div>
</div>
<!-- Visual Decorative Asset -->
<div class="relative h-48 w-full rounded-enterprise overflow-hidden mb-8 group">
<img alt="Corporate Environment" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" data-alt="A professional, brightly lit modern corporate office atrium with clean lines and glass architecture. The scene captures a high-end business environment with soft natural light flooding through large windows, creating a welcoming and sophisticated atmosphere. The color palette is dominated by neutral whites, soft grays, and deep professional blues, emphasizing institutional trust and progress in a contemporary minimalist style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDroPENVrZwYeGSeNbrMfIUjY8uZJ5kYEuefpzhlpQek58DlNb4HTi8Y1hCJekY7cmguog53p-pQQAUJU5EvCv0UC6MKRrBtxaikWPmgDRcKaprvrsA6enxnY4hteciuHRXWmVU-Et1QYBJL7jjan2xopgAqL_9hPe0xwLR3aiUSTIJlH75QZCdzgA9T8J1LEd2KI5uNrjfwcXpEX2-yp21EvND1eNpiUkwS9CxJFgN_wSxLnZ_nJjx4h0DZYqK-QRDS_3U0dF6o1z1">
<div class="absolute inset-0 bg-gradient-to-t from-primary/60 to-transparent flex items-end p-6">
<p class="text-white text-xs font-medium opacity-90 leading-relaxed">
                        您的隐私信息将受到金融级加密保护，仅用于企业身份核验与入驻流程。
                    </p>
</div>
</div>
<!-- Submit Button Area -->
<div class="pt-4">
<button class="w-full h-14 bg-primary text-on-primary rounded-enterprise font-bold text-lg shadow-lg active:scale-[0.98] transition-all hover:bg-primary/90 flex items-center justify-center gap-2 group" type="submit">
<span class="">提交注册</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
<p class="text-center text-xs text-on-surface-variant mt-4">
                    点击提交即表示您已阅读并同意 <a class="underline text-primary" href="#">《企业服务条款》</a> 与 <a class="underline text-primary" href="#">《隐私声明》</a>
</p>
</div>
</form>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-lowest dark:bg-inverse-surface border-t border-outline-variant dark:border-outline flex justify-around items-center h-16 w-full px-gutter-grid">
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-surface-variant/50 active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-sm text-label-sm">首页</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-surface-variant/50 active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="chat_bubble">chat_bubble</span>
<span class="font-label-sm text-label-sm">智能问答</span>
</a>
<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed font-semibold hover:bg-surface-variant/50 active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="business_center" style="font-variation-settings: &quot;FILL&quot; 1;">business_center</span>
<span class="font-label-sm text-label-sm">企业信息</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-surface-variant/50 active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">我的</span>
</a>
</nav>
<script>
        // Form Interaction Logic
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            
            // Visual feedback for submission
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> 处理中...';
            btn.classList.add('opacity-80');
            btn.disabled = true;

            setTimeout(() => {
                alert('资料已提交，正在审核中。');
                btn.innerHTML = originalText;
                btn.classList.remove('opacity-80');
                btn.disabled = false;
            }, 1500);
        });

        // Input effect logic
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
                input.parentElement.classList.add('transition-transform');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>




</body></html>
