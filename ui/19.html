<script>
        function toggleHeart(button) {
            const icon = button.querySelector('.material-symbols-outlined');
            const isFilled = icon.style.fontVariationSettings.includes("'FILL' 1");
            
            if (isFilled) {
                icon.style.fontVariationSettings = "'FILL' 0";
                icon.classList.remove('active-heart');
                icon.classList.add('text-on-surface-variant');
            } else {
                icon.style.fontVariationSettings = "'FILL' 1";
                icon.classList.add('active-heart');
                icon.classList.remove('text-on-surface-variant');
            }
        }

        // Add micro-interaction to cards
        document.querySelectorAll('.grid > div').forEach(card => {
            card.addEventListener('click', (e) => {
