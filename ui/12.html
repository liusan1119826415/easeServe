<!DOCTYPE html><html lang="zh-CN" style="width: 390px; min-height: 844px;"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#1E6FFF",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#D7E2FF",
                        "on-primary-container": "#001B3F",
                        secondary: "#565F71",
                        "on-secondary": "#FFFFFF",
                        surface: "#FDFBFF",
                        "on-surface": "#1A1B1F",
                        "surface-variant": "#E1E2EC",
                        "on-surface-variant": "#44474F",
                        outline: "#74777F",
                        "outline-variant": "#C4C6D0",
                        "inverse-surface": "#2F3033",
                        "surface-container-lowest": "#FFFFFF",
                        "surface-container-low": "#F7F3F2",
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "12px",
                        "xl": "16px",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Public Sans", "sans-serif"],
                        "display": ["Public Sans", "sans-serif"],
                        "body": ["Public Sans", "sans-serif"],
                        "label": ["Public Sans", "sans-serif"]
                    },
                    spacing: {
                        'margin-page': '1.5rem',
                        'gutter-grid': '1rem',
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Public Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.2s ease-in-out 0s 2;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-margin-page h-14 bg-surface-container-lowest border-b border-outline-variant">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface cursor-pointer active:scale-95 transition-transform" data-icon="close">close</span>
</div>
<h1 class="font-headline text-lg font-bold text-on-surface tracking-tight">登录</h1>
<div class="w-6"></div>
</header>
<main class="flex-grow flex flex-col pt-14 px-margin-page pb-10 pb-20">
<!-- Logo Section -->
<section class="flex flex-col items-center mt-10 mb-10 pt-14 mb-14">
<div class="w-20 h-20 mb-4 rounded-xl overflow-hidden shadow-md border-2 border-white mb-8">
<img alt="Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBOCjJjYRqGb6RK6el77_MMXhjY09Vcg-4WiDbYlFBdKgkdQvhmxXZAk-BEYJ0aDR6OfD0HEyi709-RUw0gqfUIjGrmSXryeo51pPs5S76yYfJTDERe8fbncK8RNo1XfN1uI_3Tw2djgMmNfSJFRnwGymgS-rMrRNWfo8Lw3wCOBIEdJOr9flb2VNnUtYz-wxhFJoZlqjtAaWJ6ODGb-uSbzxYuSysvSdejpF5O4xeGO07qT52MPC--IfwPP_DmJSqffZ_Qg1N6W1Va">
</div>
<h2 class="text-xl font-bold text-on-surface">欢迎登录服务体系</h2>
</section>
<!-- Input Form -->
<div class="space-y-4 w-full max-w-sm mx-auto">
<!-- Phone Number Input -->
<div class="relative">
<div class="flex items-center h-14 bg-surface-container-low rounded-lg px-4 border border-transparent focus-within:border-primary transition-all">
<span class="text-on-surface font-medium mr-3">+86</span>
<div class="w-[1px] h-6 bg-outline-variant mr-3"></div>
<input class="flex-grow bg-transparent border-none focus:ring-0 text-on-surface p-0 placeholder:text-on-surface-variant/60" placeholder="请输入手机号码" type="tel">
</div>
</div>
<!-- Verification Code Input -->
<div class="flex items-center gap-3">
<div class="flex-grow h-14 bg-surface-container-low rounded-lg px-4 border border-transparent focus-within:border-primary transition-all flex items-center">
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface p-0 placeholder:text-on-surface-variant/60" placeholder="请输入验证码" type="number">
</div>
<button class="h-14 px-4 bg-primary/10 text-primary font-medium rounded-lg whitespace-nowrap active:bg-primary/20 transition-colors" id="get-code">
                    获取验证码
                </button>
</div>
<!-- Login Button -->
<button class="w-full h-14 bg-primary text-on-primary font-bold rounded-lg shadow-md hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center mt-4 mt-10" onclick="handleLogin()">
                登录 / 注册
            </button>
</div>
<!-- Social Login -->

<!-- Footer Policy -->
<footer class="flex flex-col items-center mt-20">
<label class="flex items-start gap-3 cursor-pointer group">
<div class="relative mt-0.5">
<input class="peer absolute opacity-0 w-0 h-0" id="policy_check" type="checkbox">
<div class="w-5 h-5 border-2 border-outline rounded flex items-center justify-center peer-checked:bg-primary peer-checked:border-primary transition-colors">
<span class="material-symbols-outlined text-[16px] text-white scale-0 peer-checked:scale-100 transition-transform" data-icon="check">check</span>
</div>
</div>
<p class="text-[12px] leading-relaxed text-on-surface-variant max-w-[280px]">
                    我已阅读并同意
                    <a class="text-primary hover:underline font-medium" href="#">《用户服务协议》</a>
                    与
                    <a class="text-primary hover:underline font-medium" href="#">《隐私保护政策》</a>
</p>
</label>
</footer>
</main>
<script>
        function handleLogin() {
            const checkbox = document.getElementById('policy_check');
            if (!checkbox.checked) {
                const footer = document.querySelector('footer');
                footer.classList.add('animate-shake');
                setTimeout(() => footer.classList.remove('animate-shake'), 400);
                alert('请先阅读并同意用户协议及隐私政策');
                return;
            }
            console.log('正在执行登录流程...');
        }

        function handleSocial(platform) {
            console.log(`正在调起${platform}登录...`);
        }

        const getCodeBtn = document.getElementById('get-code');
        getCodeBtn.addEventListener('click', () => {
            let countdown = 60;
            getCodeBtn.disabled = true;
            getCodeBtn.classList.add('opacity-50');
            const timer = setInterval(() => {
                getCodeBtn.textContent = `${countdown}s 后重试`;
                countdown--;
                if (countdown < 0) {
                    clearInterval(timer);
                    getCodeBtn.textContent = '获取验证码';
                    getCodeBtn.disabled = false;
                    getCodeBtn.classList.remove('opacity-50');
                }
            }, 1000);
        });
    </script>






</body></html>
